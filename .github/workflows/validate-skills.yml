name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    name: Frontmatter, version sync, references, dashes, tool names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate
        run: node scripts/validate.mjs
